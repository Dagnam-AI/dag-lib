[project]
name = "dagnam"
version = "0.1.0"
description = "Official Python SDK for Dagnam.AI — datasets, training, model hub, deployments, and inference."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pandas>=1.5",
    "tqdm>=4.60",
    "sseclient-py>=1.7",
]

[project.optional-dependencies]
pytorch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.12"]
flax = ["jax>=0.4", "flax>=0.7"]
aio = ["httpx>=0.27", "httpx-sse>=0.4"]
all = ["torch>=2.0", "tensorflow>=2.12", "jax>=0.4", "flax>=0.7", "httpx>=0.27", "httpx-sse>=0.4"]

[project.scripts]
dagnam = "dagnam.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-cov",
    "ruff",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagnam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
