name: Claude PR Review

# What a green check here means: Claude ran on this commit and finished without
# an error. It does not mean the review found nothing, and nothing requires it
# to merge.
# What it can no longer mean: that no review happened. The action exits
# successfully WITHOUT running Claude when it skips, which it does whenever the
# pull request changes this workflow file ("Skipping action due to workflow
# validation"). The last step fails the job unless the action reports that
# Claude really ran. A pull request that edits this file therefore shows a red
# review check until the change is on the default branch: that red is accurate.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Nothing is inherited: the job states what it needs.
permissions: {}

jobs:
  review-with-tracking:
    # dag-lib is going public: only review same-repo (non-fork) PRs. Fork PRs
    # receive no secret, so the review can't authenticate anyway — skipping them
    # avoids no-op failed runs. This effectively scopes review to collaborators.
    # Dependabot runs get no Actions secrets, so Claude cannot authenticate
    # there. Skipped is accurate; a red check on every bump was noise.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Claude acts through the Claude GitHub App's token (the action exchanges
    # this job's OIDC token for it), and that token carries the App's own
    # permissions: comments, branches, commits. The job's own token only reads.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      actions: read # Lets the review read CI check results/logs on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        id: review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          # Pro/Max subscription auth (generated via `claude setup-token`)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable progress tracking (creates a checklist comment, updates as it goes)
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review focused on:

            1. Code Quality — clean-code principles, error handling, edge cases, readability.
            2. Security — vulnerabilities, input validation, auth/authz logic.
            3. Performance — bottlenecks, inefficient queries, resource/memory issues.
            4. Testing — coverage, test quality, missing scenarios.
            5. Documentation — code comments, README/API doc accuracy for new features.

            Use inline comments for specific issues and top-level comments for general
            observations or praise.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action sets `conclusion` only after Claude has run to a result
      # (src/entrypoints/run.ts at the pinned commit). On a skip it returns
      # early with exit 0 and the output stays empty; on an error it fails its
      # own step, so this one is not reached.
      - name: Fail when no review ran
        if: steps.review.outputs.conclusion != 'success'
        run: |
          echo "::error::Claude did not review this commit: the action exited without running it. The usual cause is a pull request that changes .github/workflows/claude-code-review.yml, which the action refuses to run until the change is on the default branch. The previous step's log has the reason."
          exit 1
