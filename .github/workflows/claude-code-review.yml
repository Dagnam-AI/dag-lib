name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review-with-tracking:
    # dag-lib is going public: only review same-repo (non-fork) PRs. Fork PRs
    # receive no secret, so the review can't authenticate anyway — skipping them
    # avoids no-op failed runs. This effectively scopes review to collaborators.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # Lets the review read CI check results/logs on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          # Pro/Max subscription auth (generated via `claude setup-token`)
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable progress tracking (creates a checklist comment, updates as it goes)
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review focused on:

            1. Code Quality — clean-code principles, error handling, edge cases, readability.
            2. Security — vulnerabilities, input validation, auth/authz logic.
            3. Performance — bottlenecks, inefficient queries, resource/memory issues.
            4. Testing — coverage, test quality, missing scenarios.
            5. Documentation — code comments, README/API doc accuracy for new features.

            Use inline comments for specific issues and top-level comments for general
            observations or praise.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
