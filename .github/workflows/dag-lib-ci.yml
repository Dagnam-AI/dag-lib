name: dagnam CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, type, build, and audit (Python 3.12)
    runs-on: ubuntu-latest
    env:
      # uv.toml already sets native-tls = true for local corporate-CA
      # environments. This env var is the CI equivalent — it's a no-op on
      # clean GitHub runners and harmless to leave in.
      UV_NATIVE_TLS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Type check
        run: uv run --with "pyright>=1.1.380" pyright
      - name: Import layering contract (cli -> resources -> data -> _core)
        run: uv run lint-imports
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: |
          uv run --with twine twine check dist/*
          uv run --with "readme-renderer[md]" python -m readme_renderer README.md > /dev/null
      - name: Install smoke test
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/python -c "import dagnam; dagnam.load_dataset, dagnam.configure"
      - name: Base-install isolation test (no optional ML extras eagerly imported)
        run: |
          # Verify `import dagnam` on a clean base install does NOT pull in
          # torch / tensorflow / jax / flax. Those are optional extras and
          # must stay lazy-imported to keep cold-start light for inference
          # and dataset-only users.
          python -m venv .isolation
          .isolation/bin/pip install dist/*.whl
          .isolation/bin/python -c "
          import sys
          import dagnam  # noqa: F401
          forbidden = {'torch', 'tensorflow', 'jax', 'jaxlib', 'flax', 'torchvision', 'torchaudio'}
          leaked = forbidden & set(sys.modules)
          if leaked:
              raise SystemExit(f'Optional ML deps eagerly imported on base install: {leaked}')
          print('Base import is clean; no optional ML extras leaked into sys.modules')
          "
      - name: Dependency audit
        # torch advisories are allow-listed (it is an optional extra whose
        # pinned version is CI-only; users resolve their own torch>=2.0). See
        # the audit task comment in pyproject.toml for the rationale.
        run: uv run poe audit

  tests:
    # Validates the supported Python runtime with every optional integration
    # enabled so CI matches the package metadata.
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_NATIVE_TLS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Tests
        run: uv run pytest tests -q

  coverage:
    # Single-version coverage gate. Keeps the matrix job fast while still
    # enforcing a floor on the test suite's reach. Threshold is set just
    # below the current overall figure so accidental coverage drops fail CI.
    name: Coverage gate (Python 3.12)
    runs-on: ubuntu-latest
    env:
      UV_NATIVE_TLS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests with coverage
        run: |
          uv run pytest tests \
            --cov=dagnam \
            --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=95
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-html
          path: htmlcov/
