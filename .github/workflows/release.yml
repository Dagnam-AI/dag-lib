name: Release dagnam to PyPI

on:
  push:
    tags:
      - "dagnam/v*"

# Guard against double-tag races (e.g. delete + re-push of the same tag, or two
# tags arriving simultaneously). cancel-in-progress=false because once a build
# starts uploading to PyPI we must let it finish — PyPI rejects re-uploads of
# the same version, so cancellation would just produce a half-released state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: |
          uv run --with twine twine check dist/*
          uv run --with "readme-renderer[md]" python -m readme_renderer README.md > /dev/null
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dagnam
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Install from TestPyPI and import
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install from TestPyPI
        run: |
          for i in 1 2 3 4 5; do
            pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "dagnam==${GITHUB_REF_NAME#dagnam/v}" && break
            echo "Waiting for TestPyPI indexing ($i/5)..."
            sleep 30
          done
      - name: Import smoke test
        run: |
          python -c "import dagnam; print(dagnam.__version__)"
          python -c "from dagnam import load_dataset, configure"

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dagnam
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
