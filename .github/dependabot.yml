version: 2
updates:
  # Keep Python dependencies fresh. Grouped so a single PR sweeps minor/patch
  # updates instead of producing a flood.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # filelock 4 stops removing lock files, which changes what users find in an audit or cache
    # directory (8 tests pin it). Held at 3.x until that is decided on purpose; see pyproject audit task.
    ignore:
      - dependency-name: "filelock"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The stdlib-only dagnam-record package has no dependencies of its own; this
  # keeps its build backend pin fresh.
  - package-ecosystem: "pip"
    directory: "/record"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  # Keep action pins (SHA-pinned in workflows) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
